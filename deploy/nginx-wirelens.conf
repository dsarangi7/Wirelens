# Wirelens on nginx (Windows). Paste this INSIDE the existing server { } block of nginx.conf,
# then reload nginx once:  nginx -s reload   (run in the nginx folder).
# Site: http://<server>/wirelens/      Files: C:\apps\Wirelens (git clone + projects\ data from the package)
# Updates to the files need no reload: nginx serves them as they are on disk.

location = /wirelens { return 301 /wirelens/; }

location ^~ /wirelens/ {
    alias C:/apps/Wirelens/;
    index index.html;

    # Serve only the viewer. Hide git, tools, tests, notes and scripts that live in the same folder.
    location ~ ^/wirelens/(\.git|\.gitea|\.github|\.claude|\.cursor|tools|tests|skills|docs|deploy|technotes)(/|$) { return 404; }
    location ~ ^/wirelens/projects/[^/]+/(?!cad/) { return 404; }
    location ~ \.(md|py|ps1|yml|yaml|config|gitignore|pdf|step|STEP|dxf|DXF)$ { return 404; }

    types {
        text/html               html;
        text/javascript         js mjs;
        application/json        json;
        model/gltf-binary       glb;
        image/png               png;
        image/x-icon            ico;
        image/svg+xml           svg;
    }
    gzip on;
    gzip_types text/javascript application/json model/gltf-binary;

    # Browsers re-check every file (cheap 304 when unchanged), so an update shows without Ctrl+F5.
    add_header Cache-Control "no-cache";

    # Admin panel API: deploy/admin/wirelens-admin.js, run by PM2 on 127.0.0.1:3010 (see SERVER.md).
    # Same sign-in as the site; nginx passes the signed-in email, the service lets only its admins change users.
    location ^~ /wirelens/admin-api/ {
        proxy_pass http://127.0.0.1:3010/;
        proxy_set_header Host $host;
        proxy_set_header X-Remote-User $remote_user;
        add_header Cache-Control "no-store";
    }

    # Login (browser sign-in box). Password file: one "email:$apr1$hash" line per user, kept OUTSIDE C:\apps\Wirelens.
    auth_basic "Wirelens";
    auth_basic_user_file C:/nginx/nginx-1.30.3/conf/wirelens.htpasswd;
}
