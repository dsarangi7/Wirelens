<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wirelens · Rack Wiring Guide</title>
<meta name="description" content="Interactive 3D guide to the customer wiring of an AYK battery rack: pick a cable and follow its route step by step, as the technotes describe it.">
<link rel="icon" href="assets/ayk-logo.ico">
<style>
:root {
  --bg: #080d1d; --bg2: #0d1528; --card: #111b31; --line: rgba(120,145,185,.22);
  --text: #f3f6fc; --muted: #9aabc6; --blue: #00a8ff; --blue2: #008cff; --orange: #f97316;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
button, input { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: var(--rail, 200px) var(--side, 340px) 1fr; grid-template-rows: 56px 1fr; height: 100vh; }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--line); background: rgba(8,13,29,.92); }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 16px; color: var(--text); text-decoration: none; }
.brand img { width: 26px; height: 26px; border-radius: 6px; background: #fff; padding: 2px; }
header h1 { font-size: 15px; font-weight: 600; margin: 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.views { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 6px 11px; cursor: pointer; font-size: 13px; font-weight: 600; white-space: nowrap; }
.btn:hover { background: rgba(154,171,198,.12); }
.btn.on { background: var(--blue2); border-color: var(--blue2); color: #fff; }
.seg { display: inline-flex; align-items: center; gap: 2px; margin-left: 6px; padding-left: 8px; border-left: 1px solid var(--line); }
.seg[hidden] { display: none; }
.seg-l { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: 4px; }
.btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
/* rack rail (left) and home dashboard */
.app.rail-min { --rail: 40px; }
.rail { overflow: auto; }
.rail-top { display: flex; align-items: center; gap: 6px; padding: 10px 8px 6px 12px; }
.rail-home { flex: 1; color: var(--blue); font-weight: 700; font-size: 12.5px; text-decoration: none; }
.rail-home:hover { text-decoration: underline; }
.rail-btn { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 6px; width: 24px; height: 24px; cursor: pointer; font-size: 13px; line-height: 1; padding: 0; }
.rail-search { margin: 0 8px 6px; width: calc(100% - 16px); box-sizing: border-box; padding: 6px 8px; font-size: 12.5px; }
.rail nav { padding: 0 6px 12px; }
.rproj summary { cursor: pointer; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 8px 6px 4px; list-style: none; }
.rproj summary::-webkit-details-marker { display: none; }
.rproj summary::before { content: "▸ "; } .rproj[open] summary::before { content: "▾ "; }
.rgroup { font-size: 10.5px; color: var(--muted); opacity: .8; padding: 6px 8px 2px 18px; }
.rlink { display: block; padding: 4px 8px 4px 18px; border-radius: 6px; color: var(--text); text-decoration: none; font-size: 12.8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rlink:hover { background: rgba(0,140,255,.1); }
.rlink.on { background: rgba(0,140,255,.2); color: #fff; font-weight: 600; box-shadow: inset 2px 0 0 var(--blue); }
.rail-min .rail > :not(.rail-top), .rail-min .rail-home { display: none; }
.rail-min .rail-top { padding: 10px 7px; }
.rail-min #railBtn { transform: rotate(180deg); }
.empty { color: var(--muted); padding: 8px 12px; }
#home { display: none; }
body.home { overflow: auto; }
body.home .app { display: none; }
body.home #home { display: block; min-height: 100vh; }
.home-bar { display: flex; align-items: center; height: 56px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.home-in { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
.home-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px; margin-bottom: 8px; }
.home-head h2 { margin: 0; font-size: 22px; } .home-head p { margin: 4px 0 0; color: var(--muted); }
.home-head .search { width: min(360px, 100%); }
.proj { margin-top: 22px; }
.proj h3 { font-size: 15px; margin: 0 0 4px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.proj h3 span { color: var(--muted); font-weight: 500; font-size: 12px; margin-left: 6px; }
.pgroup h4 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 8px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.rcard { position: relative; display: block; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); text-decoration: none; }
.rcard:hover, .rcard:focus-visible { border-color: var(--blue2); background: #14223f; outline: none; }
.rcard b { display: block; font-size: 14px; padding-right: 40px; }
.rcard small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
.rcard em { position: absolute; top: 10px; right: 10px; font-style: normal; font-size: 10px; color: var(--orange); border: 1px solid rgba(249,115,22,.5); border-radius: 999px; padding: 0 6px; }
aside { border-right: 1px solid var(--line); background: var(--bg2); display: flex; flex-direction: column; min-height: 0; position: relative; }
.resizer { position: absolute; top: 0; right: -4px; width: 8px; height: 100%; cursor: col-resize; z-index: 5; touch-action: none; }
.resizer:hover, .resizer.on { background: rgba(0,140,255,.35); }
.side-top { padding: 12px 14px 8px; border-bottom: 1px solid var(--line); }
.search { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; font-size: 12px; cursor: pointer; background: transparent; }
.chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.chip[aria-pressed="false"] { opacity: .45; }
.list { overflow: auto; flex: 1; padding: 6px 8px 12px; }
.group { border-bottom: 1px solid var(--line); }
.group summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 9px 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; user-select: none; }
.group summary::-webkit-details-marker { display: none; }
.group summary::before { content: '▸'; font-size: 11px; transition: transform .15s; }
.group[open] summary::before { transform: rotate(90deg); }
.group summary .n { margin-left: auto; background: rgba(154,171,198,.14); border-radius: 999px; padding: 1px 8px; letter-spacing: 0; }
.group summary:hover { color: var(--fg, #e6edf7); }
.group h3 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 12px 6px 4px; font-weight: 700; }
.item { display: flex; gap: 9px; align-items: flex-start; width: 100%; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 6px 8px; cursor: pointer; font-size: 13px; }
.item:hover { background: rgba(154,171,198,.08); }
.item.sel { background: rgba(0,140,255,.16); border-color: rgba(0,168,255,.5); }
.item i { width: 10px; height: 10px; border-radius: 3px; margin-top: 5px; flex: none; }
.item small { display: block; color: var(--muted); font-size: 11.5px; }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
#view { position: absolute; inset: 0; z-index: 0; }  /* own stacking context: CSS2D labels set their own z-index */
#view canvas { display: block; }
.lbl { font-size: 11px; font-weight: 700; color: #fff; background: rgba(8,13,29,.78); border: 1px solid rgba(0,168,255,.55); padding: 1px 6px; border-radius: 5px; pointer-events: none; white-space: nowrap; }
.lbl.panel { border-color: #a855f7; }
.tip { position: absolute; pointer-events: none; background: #0b1220; border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; font-size: 12px; display: none; max-width: 280px; }
.card { position: absolute; right: 14px; bottom: 14px; width: min(430px, calc(100% - 28px)); max-height: calc(100% - 28px); overflow: auto; background: rgba(17,27,49,.96); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: 0 20px 50px rgba(0,0,0,.45); }
.card[hidden] { display: none; }
.card h2 { margin: 0 0 2px; font-size: 16px; }
.card .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 3px 10px; font-size: 12.5px; margin-bottom: 10px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; }
.steps li { counter-increment: s; position: relative; padding: 6px 8px 6px 34px; border-radius: 8px; font-size: 12.8px; cursor: pointer; color: var(--muted); }
.steps li::before { content: counter(s); position: absolute; left: 7px; top: 6px; width: 19px; height: 19px; border-radius: 50%; background: #23314f; color: #cfe0ff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.steps li.done { color: #c7d3e8; }
.steps li.cur { background: rgba(0,140,255,.14); color: var(--text); }
.steps li.cur::before { background: var(--blue2); color: #fff; }
.steps li .tn { font-size: 11px; color: var(--blue); margin-left: 4px; }
.steps li.cust::before { background: #a855f7; }
.player { display: flex; gap: 6px; margin: 10px 0 2px; align-items: center; }
.player .grow { flex: 1; }
.player .speed { display: inline-flex; gap: 2px; margin-left: 4px; }
.player .speed .btn { padding: 4px 7px; font-size: 12px; }
.badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; }
.card, .legend, .about, .about-box { z-index: 4; }
.tip { z-index: 5; }
.legend { position: absolute; left: 14px; bottom: 14px; background: rgba(17,27,49,.9); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; font-size: 12px; color: var(--muted); max-width: 300px; }
.legend b { color: var(--text); }
.about { position: absolute; left: 14px; top: 14px; }
.about-box { position: absolute; left: 14px; top: 52px; width: min(440px, calc(100% - 28px)); background: rgba(17,27,49,.97); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 12.5px; }
.about-box[hidden] { display: none; }
.about-box ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
@media (max-width: 820px) {
  body { overflow: auto; }
  .rail { display: none; }
  .app { grid-template-columns: 1fr; grid-template-rows: auto 60vh auto; height: auto; }
  header { flex-wrap: wrap; padding: 8px 16px; gap: 8px; }
  header h1 { display: none; }
  .views { margin-left: 0; }
  .stage { order: 2; min-height: 60vh; }
  aside { order: 3; border-right: 0; border-top: 1px solid var(--line); max-height: none; }
  .card { position: static; width: auto; margin: 12px 16px; max-height: none; }
  .legend { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="home">
  <div class="home-bar"><span class="brand"><img src="assets/ayk-energy-logo.png" alt=""> Wirelens</span></div>
  <main id="homeMain"></main>
</div>
<div class="app">
  <header>
    <a class="brand" href="./"><img src="assets/ayk-energy-logo.png" alt=""> Wirelens</a>
    <h1 id="title">Rack wiring guide</h1>
    <div class="views" role="group" aria-label="Camera">
      <button class="btn on" data-view="rear">Rear</button>
      <button class="btn" data-view="front">Front</button>
      <button class="btn" data-view="panel">Signal panel</button>
      <button class="btn" data-view="msm">MSM</button>
      <button class="btn" data-view="iso">Overview</button>
      <button class="btn" id="cadBtn" hidden aria-pressed="false">CAD model</button>
      <span class="seg" id="frontSeg" role="group" aria-label="Front cables" hidden><span class="seg-l">Front</span><button class="btn" data-front="dc">Power</button><button class="btn" data-front="comm">Comm</button><button class="btn" data-front="both">Both</button></span>
    </div>
  </header>
  <aside class="rail" id="rail" aria-label="Racks"></aside>
  <aside aria-label="Cables">
    <div class="resizer" id="resizer" role="separator" aria-orientation="vertical" aria-label="Drag to resize the cable list" tabindex="0"></div>
    <div class="side-top">
      <input class="search" id="search" type="search" placeholder="Find a cable or port (e.g. SSC3, EMS)" aria-label="Find a cable or port">
      <div class="chips" id="chips"></div>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <main class="stage">
    <div id="view"></div>
    <div class="loading" id="loading">Loading the rack…</div>
    <div class="tip" id="tip"></div>
    <button class="btn about" id="aboutBtn" aria-expanded="false">About this model</button>
    <div class="about-box" id="about" hidden></div>
    <div class="legend" id="legend"><b>Pick a cable</b> in the list, or click a port or cable in the model. Drag to rotate, scroll to zoom, right-drag to pan.</div>
    <section class="card" id="card" hidden aria-live="polite"></section>
  </main>
</div>
<script src="js/racks.js?v=2"></script>
<script src="js/guide-data.js?v=2"></script>
<script type="module" src="js/guide3d.js?v=2"></script>
</body>
</html>
