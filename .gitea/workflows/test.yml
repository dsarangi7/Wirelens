# Gitea Actions (used instead of .github/workflows when this folder exists).
# Gitea has no Pages hosting, so this only runs the tests. Deployment to a
# company web server can be added once there is a target host.
name: Test Wirelens

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/guide.test.js
